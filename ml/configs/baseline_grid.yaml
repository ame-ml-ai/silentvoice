# Experiment A: pretrained Auto-AVSR VSR model, no fine-tuning, GRID unseen-speaker test set.
experiment: baseline
output_dir: experiments/baseline
seed: 42
checkpoint: checkpoints/vsr_trlrs3vox2_base.pth
manifest: data/processed/grid/manifest.jsonl
data_root: data/processed/grid/videos
split: test
device: cuda          # "cpu" allowed for --limit smoke runs on the Mac
decode:
  beam_size: 40
  ctc_weight: 0.1
  length_penalty: 0.0
